global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: mock-interview-api
    metrics_path: /metrics
    static_configs:
      # `host.docker.internal` reaches the host's `cargo run -p api` from inside
      # the compose network. On Linux this requires `host-gateway` mapping.
      - targets: ["host.docker.internal:9090"]
        labels:
          service: mock-interview-api
          env: dev
